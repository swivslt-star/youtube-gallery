<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My YouTube | 나만의 유튜브</title>
    <meta name="description" content="내가 구독하는 유튜버의 최신 영상을 한눈에 볼 수 있는 맞춤형 갤러리">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background animated gradient orbs -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Header -->
    <header class="header" id="header">
        <div class="header-inner">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="4" rx="4" width="20" height="16" fill="url(#logoGrad)"/>
                    <polygon points="10,8.5 16,12 10,15.5" fill="white"/>
                    <defs>
                        <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#FF6B6B"/>
                            <stop offset="100%" stop-color="#FF2D55"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1 class="logo-text">My YouTube</h1>
            </div>
            <div class="top-nav-replacement" style="display:flex; gap:10px;">
                <a href="index.html" class="btn-top-1000">🏠 구독</a>
                <a href="index1000.html" class="btn-top-1000">🔥 Top 1000</a>
                <a href="indexAlgorithm.html" class="btn-top-1000" style="opacity: 0.5;">✨ 알고리즘</a>
            </div>
            <div class="header-actions">
                <select id="sort-select" class="sort-select">
                    <option value="latest">최신순</option>
                    <option value="views">조회수순</option>
                    <option value="name">이름순</option>
                </select>
                <button class="icon-btn" id="btn-playlist" title="연속 재생목록 생성">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
                </button>
                <button class="icon-btn" id="btn-refresh" title="새로고침">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                </button>
                <button class="icon-btn" id="btn-settings" title="설정">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>채널 설정</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p class="modal-desc">구독할 YouTube 채널의 <strong>채널 ID</strong>를 추가하세요.<br>
                채널 ID는 유튜브 채널 URL에서 확인할 수 있습니다.<br>
                <code>youtube.com/channel/<strong>UC...</strong></code></p>
                <div id="channel-list" class="channel-list">
                    <!-- dynamically populated -->
                </div>
                <div class="add-channel-form">
                    <input type="text" id="new-channel-name" placeholder="채널 이름 (예: 침착맨)" class="input-field">
                    <input type="text" id="new-channel-id" placeholder="채널 ID (예: UCUj6rrhMTR9pipbAWBAMvUQ)" class="input-field">
                    <button class="btn-add" id="btn-add-channel">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        채널 추가
                    </button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-save" id="btn-save-settings">저장 및 새로고침</button>
            </div>
        </div>
    </div>

    <!-- Playlist Modal -->
    <div class="modal-overlay" id="playlist-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>연속 재생목록 생성</h2>
                <button class="modal-close" id="playlist-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p class="modal-desc">유튜브 정책상 한 번에 <strong>최대 50개</strong>의 영상만 묶을 수 있습니다. 원하시는 구간을 선택해주세요.</p>
                <div id="playlist-links" class="channel-list">
                    <!-- dynamically populated -->
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main" id="main">
        <!-- Category Filters -->
        <div id="category-filters" class="category-filters">
            <!-- Buttons will be generated dynamically -->
        </div>

        <!-- Loading state -->
        <div class="loading" id="loading">
            <div class="loader">
                <div class="loader-ring"></div>
                <div class="loader-ring"></div>
                <div class="loader-ring"></div>
            </div>
            <p class="loading-text">최신 영상을 불러오는 중...</p>
        </div>

        <!-- Video Grid -->
        <div class="video-grid" id="video-grid">
            <!-- Cards will be dynamically generated -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state" style="display:none;">
            <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" class="empty-icon">
                <circle cx="60" cy="60" r="50" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
                <rect x="35" y="40" rx="8" width="50" height="35" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none"/>
                <polygon points="52,50 52,66 66,58" fill="rgba(255,255,255,0.15)"/>
                <line x1="30" y1="90" x2="90" y2="30" stroke="rgba(255,107,107,0.3)" stroke-width="2"/>
            </svg>
            <h2>영상을 불러올 수 없습니다</h2>
            <p>설정에서 채널을 추가해주세요</p>
        </div>
    </main>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script src="channelsAlgorithm.js"></script>
    <script src="cached_videosAlgorithm.js"></script>
    <script src="counts.js"></script>
    <script src="app2.js"></script>
</body>
</html>
