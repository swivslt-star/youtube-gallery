name: Update YouTube Videos

on:
  schedule:
    # 매 6시간마다 실행 (UTC 기준 0, 6, 12, 18시 -> 한국시간 9, 15, 21, 3시)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 수동으로 버튼을 눌러서 실행할 수 있게 함

jobs:
  update-videos:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 커밋 권한 필요

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Run sync script
        run: |
          node sync.js
          node sync1000.js
          node syncAlgorithm.js

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update latest YouTube videos"
          file_pattern: "cached_videos.js"
